---
# Example playbook to orchestrate the package_manager role phases

- name: "Phase 1: Collect baseline packages"
  hosts: target_servers
  gather_facts: yes
  become: true
  roles:
    - role: package_manager
      tasks_from: gather_baseline

- name: "Phase 2: Collect target packages"
  hosts: target_servers
  gather_facts: yes
  become: true
  roles:
    - role: package_manager
      tasks_from: gather_targets

- name: "Phase 3: Generate reports"
  hosts: localhost
  connection: local
  gather_facts: yes
  roles:
    - role: package_manager
      tasks_from: generate_report
