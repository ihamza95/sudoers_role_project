---
# Phase 1: Push baseline file to target servers
# IMPORTANT: This file must be included with include_tasks from a play that targets the target_servers group

- name: "Ensure /tmp exists on target servers"
  file:
    path: /tmp
    state: directory
    mode: '0755'

- name: "Copy baseline file from controller to target servers"
  copy:
    src: "roles/package_manager/files/baseline"
    dest: "/tmp/baseline"
    mode: '0644'

- name: "Verify baseline file copied successfully"
  stat:
    path: /tmp/baseline
  register: baseline_stat
  failed_when: not baseline_stat.stat.exists

- name: "Display baseline file status on target"
  debug:
    msg: "Baseline file successfully deployed to {{ inventory_hostname }}:/tmp/baseline"
