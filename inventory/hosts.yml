---
# Inventory for Package Manager Baseline & Compliance Playbook

all:
  children:
    
    target_servers:
      hosts:
        # Add your target Oracle Linux 9 servers here
        # Example:
        # server1.example.com:
        #   ansible_user: ansible
        # server2.example.com:
        #   ansible_user: ansible
        # server3.example.com:
        #   ansible_user: ansible
        # 
        # Replace example.com with your domain
        # Add/remove servers as needed
        
        server1.example.com:
          ansible_user: ansible
        server2.example.com:
          ansible_user: ansible
        server3.example.com:
          ansible_user: ansible

  vars:
    # Global variables for all hosts
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
    ansible_python_interpreter: /usr/bin/python3
